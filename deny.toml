[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# cargo-audit also ignores RUSTSEC-2024-0388: `derivative` is a target-specific
# SCAPI/Alloy transitive that cargo-deny filters from the supported target graph;
# removing it requires an upstream SCAPI dependency change.
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "Unmaintained transitive dependency in Alloy; no compatible maintained replacement is available through the pinned SCAPI revision." },
    { id = "RUSTSEC-2025-0134", reason = "Unmaintained reqwest 0.11 helper pulled by walletconnect-sdk through SCAPI; removal requires an upstream SCAPI dependency change." },
]

[licenses]
confidence-threshold = 0.8
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/N-010/scapi"]
